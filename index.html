<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mực &amp; Giấy — Ấn phẩm thiết kế</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#FFFFFF;
  --paper-alt:#F1F1F1;
  --ink:#211922;
  --ink-soft:#6A6A6A;
  --rule:#E9E9E9;
  --navy:#2B4A6F;
  --navy-l:#DCE4EC;
  --red:#E60023;
  --red-dark:#AD081B;
  --red-l:#FCE1E4;
  --ochre:#A97A26;
  --ochre-l:#F3E7CE;
  --teal:#3E6B57;
  --teal-l:#DCE7DF;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{ height:100%; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }

.app{ height:100vh; display:flex; flex-direction:column; }

/* ===== masthead ===== */
.masthead{
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:14px 28px;
  display:flex; align-items:center; gap:14px;
}
.masthead .logo-mark{
  width:36px; height:36px; border-radius:50%; background:var(--red);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; flex:none;
}
.masthead h1{
  font-family:'Poppins',sans-serif; font-weight:700;
  font-size:19px; letter-spacing:-0.01em; color:var(--ink);
}
.masthead .tagline{
  font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft);
}

/* ===== layout ===== */
.layout{ flex:1; min-height:0; display:grid; grid-template-columns:170px minmax(0,1fr) minmax(0,1fr); }

/* ===== sidenav ===== */
.sidenav{
  padding:16px 10px;
  overflow-y:auto; min-height:0;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.sidenav a{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  width:64px; padding:10px 4px; border-radius:16px;
  text-decoration:none; color:var(--ink);
  font-family:'Inter',sans-serif; font-size:11px; font-weight:500;
  transition:background-color .15s ease;
}
.sidenav a svg{ width:22px; height:22px; stroke:var(--ink); }
.sidenav a:hover{ background:var(--paper-alt); }
.sidenav a.active{ background:var(--ink); color:#fff; }
.sidenav a.active svg{ stroke:#fff; }
.sidenav .meta{
  margin-top:24px; font-family:'Inter',sans-serif; font-size:10px;
  color:var(--ink-soft); line-height:1.7; text-align:center;
}

/* ===== catalog ===== */
.catalog{ padding:20px 28px; min-width:0; overflow-y:auto; min-height:0; }
.toolbar{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
.search-wrap{ position:relative; }
.search-wrap svg{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; stroke:var(--ink-soft); pointer-events:none;
}
.toolbar input{
  width:100%; font-family:'Inter',sans-serif; font-size:14px;
  padding:12px 16px 12px 40px;
  border:none; background:var(--paper-alt); color:var(--ink);
  border-radius:24px;
}
.toolbar input:focus{ outline:2px solid var(--ink); outline-offset:1px; }

.cat-row{ display:flex; gap:8px; flex-wrap:wrap; }
.cat-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
  padding:8px 16px; border-radius:20px; border:none; cursor:pointer;
  background:var(--paper-alt); color:var(--ink);
  transition:background-color .15s ease, color .15s ease;
}
.cat-btn:hover{ background:#e3e3e3; }
.cat-btn.active{ background:var(--ink); color:#fff; }

.count-row{
  font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft);
  margin-bottom:14px;
}

.grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
}
.card{
  font-family:inherit; text-align:left; background:var(--paper);
  border:none; cursor:pointer; padding:0;
  display:flex; flex-direction:column; transition:box-shadow .15s ease;
  border-radius:16px; overflow:hidden;
}
.card:hover{ box-shadow:0 6px 18px rgba(0,0,0,.14); }
.card.selected{ box-shadow:0 0 0 2px var(--red); }
.card:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

.cover{
  aspect-ratio:3/4; position:relative; overflow:hidden;
  background-size:cover; background-position:top center; background-color:var(--paper-alt);
  transition:transform .25s ease;
}
.card:hover .cover{ transform:scale(1.1); }

.card-body{ padding:10px 12px 14px; display:flex; flex-direction:column; gap:6px; }
.tag-pill{
  display:inline-block; width:fit-content;
  font-family:'Inter',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.02em;
  padding:3px 10px; border-radius:20px;
}
.tag-pill.cat-navy{ background:var(--navy-l); color:var(--navy); }
.tag-pill.cat-red{ background:var(--red-l); color:var(--red-dark); }
.tag-pill.cat-ochre{ background:var(--ochre-l); color:var(--ochre); }
.tag-pill.cat-teal{ background:var(--teal-l); color:var(--teal); }
.card-body h3{
  font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; line-height:1.3; color:var(--ink);
}

.code{
  font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft);
}

/* ===== detail panel ===== */
.detail{
  background:var(--paper-alt); padding:24px 26px; overflow-y:auto; min-height:0;
}
.detail-card{
  background:var(--paper); border-radius:20px; padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.detail-eyebrow{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;
}
.proof{
  position:relative; margin:0 0 18px;
}
.proof-inner{
  height:600px; position:relative; overflow:hidden;
  background-color:var(--paper-alt);
  border-radius:16px;
}
.proof-img{
  width:100%; height:100%; object-fit:contain; display:block;
  user-select:none; -webkit-user-drag:none; touch-action:none;
  transform-origin:center center; cursor:zoom-in;
}
.proof-hint{
  font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft);
  margin:8px 2px 0; text-align:right;
}

.detail h2.title{
  font-family:'Poppins',sans-serif; font-weight:700; font-size:20px; margin-bottom:4px; line-height:1.3;
}
.detail .code-line{
  font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft);
  margin-bottom:18px;
}
.spec-table{ width:100%; border-collapse:collapse; margin-bottom:18px; }
.spec-table tr{ border-bottom:1px solid var(--rule); }
.spec-table tr:first-child{ border-top:1px solid var(--rule); }
.spec-table td{ padding:8px 0; font-size:13px; vertical-align:top; }
.spec-table td:first-child{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11px; color:var(--ink-soft);
  width:40%; padding-right:10px;
}
.desc-label{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;
}
.desc-text{ font-size:14px; line-height:1.65; color:var(--ink); }

@media (max-width:980px){
  .app{ height:auto; }
  .layout{ grid-template-columns:1fr; }
  .sidenav{
    flex-direction:row; justify-content:center;
    border-bottom:1px solid var(--rule);
    padding:10px; overflow-y:visible;
  }
  .sidenav .meta{ display:none; }
  .catalog{ overflow-y:visible; }
  .grid{ grid-template-columns:repeat(2,1fr); }
  .detail{ overflow-y:visible; }
}
@media (max-width:520px){
  .grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .masthead{ padding:12px 16px; }
  .masthead h1{ font-size:16px; }
  .catalog{ padding:16px; }
  .detail{ padding:16px; }
}
</style>

let selectedId = products[0].id;

function cardHTML(p){
  const bg = p.img ? ` style="background-image:url('${p.img}')"` : '';
  return `<button class="card ${p.id===selectedId?'selected':''}" data-id="${p.id}" aria-label="${p.title}">
    <div class="cover"${bg}></div>
    <div class="card-body">
      <span class="tag-pill cat-${p.cat}">${p.category}</span>
      <h3>${p.title}</h3>
      <span class="code">${p.code}</span>
    </div>
  </button>`;
}

function detailHTML(p){
  const imgTag = p.img ? `<img class="proof-img" src="${p.img}" alt="${p.title}" draggable="false">` : '';
  const hint = p.img ? `<div class="proof-hint">Bấm để phóng to · di chuyển chuột để xem · bấm lần nữa để thu về</div>` : '';
  return `
    <div class="detail-card">
      <div class="detail-eyebrow">Xem chi tiết</div>
      <div class="proof">
        <div class="proof-inner">${imgTag}</div>
      </div>
      ${hint}
      <h2 class="title">${p.title}</h2>
      <div class="code-line">${p.code} · ${p.category}</div>
      <table class="spec-table">
        <tr><td>Kích thước</td><td>${p.size}</td></tr>
        <tr><td>Chất liệu</td><td>${p.material}</td></tr>
        <tr><td>Ghi chú</td><td>${p.extra}</td></tr>
      </table>
      <div class="desc-label">Mô tả chi tiết</div>
      <p class="desc-text">${p.desc}</p>
    </div>
  `;
}

function setupZoom(){
  const img = document.querySelector('.proof-img');
  if(!img) return;
  const container = img.closest('.proof-inner');
  const ZOOM = 2.4;
  let scale = 1, tx = 0, ty = 0;

  function apply(withTransition){
    img.style.transition = withTransition ? 'transform .25s ease' : 'none';
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    img.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';
  }

  function panTo(clientX, clientY){
    const rect = container.getBoundingClientRect();
    const offsetX = clientX - rect.left - rect.width / 2;
    const offsetY = clientY - rect.top - rect.height / 2;
    const maxX = (scale - 1) * rect.width / 2;
    const maxY = (scale - 1) * rect.height / 2;
    tx = Math.min(maxX, Math.max(-maxX, -offsetX * (scale - 1)));
    ty = Math.min(maxY, Math.max(-maxY, -offsetY * (scale - 1)));
    apply(false);
  }

  function toggleZoom(clientX, clientY){
    if(scale === 1){
      scale = ZOOM;
      panTo(clientX, clientY);
    } else {
      scale = 1; tx = 0; ty = 0;
      apply(true);
    }
  }

  img.addEventListener('click', e=>{
    toggleZoom(e.clientX, e.clientY);
  });

  img.addEventListener('mousemove', e=>{
    if(scale === 1) return;
    panTo(e.clientX, e.clientY);
  });

  img.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    if(scale > 1) panTo(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  img.addEventListener('touchmove', e=>{
    if(scale === 1 || e.touches.length !== 1) return;
    panTo(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  img.addEventListener('touchend', e=>{
    const t = e.changedTouches[0];
    toggleZoom(t.clientX, t.clientY);
  });

  apply(false);
}

const grid = document.getElementById('grid');
const detail = document.getElementById('detail');
const countRow = document.getElementById('count');
const searchInput = document.getElementById('search');
const catRow = document.getElementById('catRow');
let currentCategory = 'all';

function renderGrid(){
  const q = searchInput.value.trim().toLowerCase();
  const list = products.filter(p =>
    (currentCategory === 'all' || p.category === currentCategory) &&
    p.title.toLowerCase().includes(q)
  );
  grid.innerHTML = list.map(cardHTML).join('');
  countRow.textContent = `${list.length} / ${products.length} sản phẩm`;
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedId = Number(el.dataset.id);
      renderGrid();
      renderDetail();
      if(window.innerWidth <= 980){
        detail.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  });
}

function renderDetail(){
  const p = products.find(x=>x.id===selectedId) || products[0];
  detail.innerHTML = detailHTML(p);
  setupZoom();
}

searchInput.addEventListener('input', renderGrid);
catRow.addEventListener('click', e=>{
  const btn = e.target.closest('.cat-btn');
  if(!btn) return;
  currentCategory = btn.dataset.cat;
  catRow.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderGrid();
});

renderGrid();
renderDetail();
</script>
