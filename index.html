<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện toán nhân chia lớp 3</title>
<style>
:root{
  --bg:#fff6d6; --card:#ffffff; --ink:#1f2a44; --muted:#5b6785;
  --accent:#2f6fed; --accent-ink:#ffffff; --ok:#1f9d55; --ok-bg:#d8f5e3;
  --bad:#d6452f; --bad-bg:#ffe1db; --line:#1f2a44; --shadow:#1f2a44; --slot:#c9bf93;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16203a; --card:#223055; --ink:#fff4cf; --muted:#b5c0e0;
    --accent:#ffcf3f; --accent-ink:#1f2a44; --ok:#6fe3a0; --ok-bg:#1d4a35;
    --bad:#ff9a85; --bad-bg:#5a2a26; --line:#fff4cf; --shadow:#0a1020; --slot:#4a5a88;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16203a; --card:#223055; --ink:#fff4cf; --muted:#b5c0e0;
  --accent:#ffcf3f; --accent-ink:#1f2a44; --ok:#6fe3a0; --ok-bg:#1d4a35;
  --bad:#ff9a85; --bad-bg:#5a2a26; --line:#fff4cf; --shadow:#0a1020; --slot:#4a5a88;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:520px}
h1{font-size:1.6rem;margin:4px 0 12px;text-align:center}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;padding:6px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.score{display:flex;justify-content:space-around;font-weight:700;font-size:1.05rem;margin-bottom:8px;color:var(--muted)}
.score b{color:var(--ink);font-size:1.3rem}
.lego{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:8px 8px 4px;margin-bottom:16px;text-align:center}
.lego svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.lego.done{box-shadow:0 0 0 6px var(--accent);animation:hop .7s ease 3}
@keyframes hop{50%{transform:translateY(-14px) scale(1.03)}}
.tog{border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;padding:6px 16px;border-radius:999px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.lego .cap{margin:0 0 6px;font-weight:700;color:var(--muted)}
.pop{animation:pop .5s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:translateY(-40px) scale(1.2);opacity:0}70%{transform:translateY(3px) scale(1)}100%{transform:none;opacity:1}}
.card{background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:24px 18px;text-align:center}
.problem{font-size:clamp(2.6rem,12vw,4.2rem);font-weight:800;letter-spacing:.02em;margin:0 0 18px;line-height:1.1}
.row{display:flex;gap:10px;justify-content:center;align-items:center}
input{width:9ch;font:inherit;font-size:2.2rem;font-weight:800;text-align:center;border:4px solid var(--line);border-radius:18px;padding:6px;background:var(--bg);color:var(--ink)}
button.go{font:inherit;font-size:1.4rem;font-weight:800;border:4px solid var(--line);background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 var(--shadow)}
button.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.msg{min-height:4.2em;margin-top:18px;font-size:1.3rem;font-weight:700;border-radius:18px;padding:10px 12px;display:flex;align-items:center;justify-content:center}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.end h2{font-size:1.7rem;margin:0 0 8px}
.end p{font-size:1.2rem;font-weight:700;margin:0 0 18px;color:var(--muted)}
[hidden]{display:none!important}
.hint{margin-top:14px;color:var(--muted);font-size:.95rem;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <h1>Luyện toán nhân chia</h1>
  <div class="bar" role="group" aria-label="Chọn dạng toán">
    <button class="chip" data-mode="mix" aria-pressed="true">Trộn</button>
    <button class="chip" data-mode="mul" aria-pressed="false">Nhân</button>
    <button class="chip" data-mode="div" aria-pressed="false">Chia</button>
    <button class="tog" id="mute" aria-pressed="false" aria-label="Bật hoặc tắt âm thanh">🔊 Có tiếng</button>
  </div>
  <div class="score">
    <span>Câu: <b id="qnum">1</b>/10</span>
    <span>Đúng: <b id="right">0</b></span>
  </div>
  <div class="lego" id="legoBox">
    <p class="cap" id="cap">Mỗi câu đúng thêm 1 mảnh Lego!</p>
    <div id="lego" role="img" aria-label="Hình Lego đang được xây"></div>
  </div>
  <section class="card" id="play">
    <p class="problem" id="problem" aria-live="polite">…</p>
    <div class="row">
      <input id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Đáp án" maxlength="4">
      <button class="go" id="check">Kiểm tra</button>
    </div>
    <div class="msg" id="msg" role="status">Hãy nhập đáp án nhé!</div>
  </section>
  <section class="card end" id="end" hidden>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button class="go" id="again">Chơi lại</button>
  </section>
  <p class="hint">Mỗi lượt có 10 câu, mỗi câu trả lời một lần. Bấm Enter để kiểm tra.</p>
</main>

  /* Âm thanh (tạo bằng Web Audio, không cần tệp ngoài) */
  var ac=null, muted=false;
  function audio(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac&&ac.state==='suspended'){ ac.resume(); }
    return ac;
  }
  function tone(f,t0,d,type,vol){
    var a=audio(); if(!a||muted) return;
    var o=a.createOscillator(), g=a.createGain(), s=a.currentTime+t0;
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(vol||0.2,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s+d+0.05);
  }
  function sfxOk(){ tone(659,0,.14,'triangle',.28); tone(988,.09,.3,'triangle',.28); tone(1319,.2,.12,'sine',.1); }
  function sfxBad(){ tone(240,0,.18,'square',.09); tone(180,.14,.3,'square',.09); }
  function sfxWin(){
    var n=[523,659,784,1047,784,1047,1319,1568], t=[0,.15,.3,.45,.7,.85,1,1.2], i;
    for(i=0;i<n.length;i++) tone(n[i],t[i],i===n.length-1?.8:.22,'triangle',.3);
    tone(262,0,1.8,'sine',.12); tone(392,.45,1.6,'sine',.1);
  }
  function sfxEnd(){ tone(523,0,.25,'triangle',.25); tone(659,.15,.25,'triangle',.25); tone(784,.3,.5,'triangle',.25); }
  document.getElementById('mute').addEventListener('click',function(){
    muted=!muted;
    this.setAttribute('aria-pressed',muted?'true':'false');
    this.textContent=muted?'🔇 Tắt tiếng':'🔊 Có tiếng';
    if(!muted) sfxOk();
  });

  /* Hiệu ứng ăn mừng: pháo giấy */
  var fx=document.getElementById('fx'), fctx=fx.getContext('2d'), parts=[], raf=0, fxT=[], pending=0;
  function sizeFx(){
    var d=window.devicePixelRatio||1;
    fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0);
  }
  window.addEventListener('resize',sizeFx);
  function stopFx(){
    var i; for(i=0;i<fxT.length;i++) clearTimeout(fxT[i]);
    fxT=[]; pending=0; parts=[]; cancelAnimationFrame(raf);
    fctx.clearRect(0,0,innerWidth,innerHeight);
  }
  function burst(n,x,y){
    var cols=[R,Y,B,G,O,P], i;
    for(i=0;i<n;i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*14,vy:-Math.random()*13-5,g:.3,w:6+Math.random()*6,h:8+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.35,col:cols[i%6],life:0,max:130+Math.random()*60});
  }
  function rain(n){
    var cols=[R,Y,B,G,O,P], i;
    for(i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-10-Math.random()*80,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.02,w:6+Math.random()*6,h:8+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.3,col:cols[i%6],life:0,max:220});
  }
  function later(fn,ms){
    pending++;
    fxT.push(setTimeout(function(){ pending--; fn(); loop(); },ms));
  }
  function loop(){
    cancelAnimationFrame(raf);
    fctx.clearRect(0,0,innerWidth,innerHeight);
    var i, o;
    for(i=parts.length-1;i>=0;i--){
      o=parts[i]; o.vy+=o.g; o.vx*=.99; o.x+=o.vx; o.y+=o.vy; o.rot+=o.vr; o.life++;
      if(o.y>innerHeight+20||o.life>o.max){ parts.splice(i,1); continue; }
      fctx.save(); fctx.globalAlpha=o.life>o.max*.8?(o.max-o.life)/(o.max*.2):1;
      fctx.translate(o.x,o.y); fctx.rotate(o.rot); fctx.fillStyle=o.col;
      fctx.fillRect(-o.w/2,-o.h/2,o.w,o.h); fctx.restore();
    }
    if(parts.length||pending>0) raf=requestAnimationFrame(loop);
  }
  function celebrate(full){
    if(full) sfxWin(); else sfxEnd();
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    sizeFx(); stopFx();
    var w=innerWidth, h=innerHeight, k=full?70:25;
    burst(k,w*.15,h*.75); burst(k,w*.85,h*.75);
    if(full){
      later(function(){ burst(60,w*.5,h*.8); },500);
      later(function(){ rain(90); },900);
      later(function(){ burst(60,w*.25,h*.7); burst(60,w*.75,h*.7); },1400);
    }
    loop();
  }
  function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function pickModel(){
    var i; do{ i=rnd(0,MODELS.length-1); }while(i===lastModel);
    lastModel=i; model=MODELS[i];
  }
  var mode="mix", answer=0, q=0, right=0, locked=false;
  var $=function(id){return document.getElementById(id)};
  var problem=$("problem"), ans=$("ans"), msg=$("msg");
  var praise=["Giỏi quá!","Chính xác!","Tuyệt vời!","Làm tốt lắm!","Con giỏi lắm!"];
  function rnd(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo}
  function setMsg(t,c){msg.textContent=t;msg.className="msg"+(c?" "+c:"")}

  function drawLego(n,popIdx){
    var s='<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg">', i, k;
    for(i=0;i<model.p.length;i++){
      var on=i<n, f=on?model.p[i][0]:"none";
      var at=' fill="'+f+'" stroke="'+(on?'var(--line)':'var(--slot)')+'" stroke-width="'+(on?2.5:2)+'" stroke-linejoin="round"'+(on?'':' stroke-dasharray="6 4"');
      s+='<g'+(i===popIdx?' class="pop"':'')+'>';
      for(k=0;k<model.p[i][1].length;k++){
        var h=model.p[i][1][k];
        if(h[0]==="r") s+='<rect x="'+h[1]+'" y="'+h[2]+'" width="'+h[3]+'" height="'+h[4]+'" rx="'+h[5]+'"'+at+'/>';
        else if(h[0]==="c") s+='<circle cx="'+h[1]+'" cy="'+h[2]+'" r="'+h[3]+'"'+at+'/>';
        else s+='<polygon points="'+h[1]+'"'+at+'/>';
      }
      s+='</g>';
    }
    $("lego").innerHTML=s+'</svg>';
    $("lego").setAttribute("aria-label","Hình "+model.n+" Lego: "+n+"/10 mảnh");
  }
  function stats(){ $("right").textContent=right; $("qnum").textContent=Math.min(q+1,TOTAL); }

  function next(){
    var op = mode==="mix" ? (Math.random()<0.5?"mul":"div") : mode;
    var x=rnd(2,9), y=rnd(2,9);
    if(op==="mul"){ answer=x*y; problem.textContent=x+" × "+y+" = ?"; }
    else { answer=x; problem.textContent=(x*y)+" ÷ "+y+" = ?"; }
    ans.value=""; locked=false; stats(); ans.focus();
  }
  function finish(){
    $("play").hidden=true; $("end").hidden=false; stats();
    var full=right===TOTAL;
    celebrate(full);
    $("legoBox").classList.toggle("done",full);
    $("cap").textContent=full?cap1(model.n)+" Lego đã hoàn thành!":"Con xây được "+right+"/10 mảnh "+model.n;
    $("endTitle").textContent=full?"🎉 Hoàn hảo! 10/10":"Con đúng "+right+"/10 câu";
    $("endText").textContent=full?"Con đã xây xong "+model.n+" Lego. Giỏi quá!":"Chơi lại để xây một hình mới nhé!";
  }
  function advance(delay){
    setTimeout(function(){
      q++; stats();
      if(q>=TOTAL){ finish(); } else { setMsg("Câu tiếp theo nào!",""); next(); }
    },delay);
  }
  function check(){
    if(locked) return;
    var v=ans.value.trim();
    if(v===""){ setMsg("Con nhập đáp án trước nhé!","bad"); ans.focus(); return; }
    locked=true;
    if(parseInt(v,10)===answer){
      right++; $("right").textContent=right; drawLego(right,right-1); sfxOk();
      setMsg(praise[rnd(0,praise.length-1)],"ok"); advance(1200);
    } else {
      setMsg("Chưa đúng. Đáp án là "+answer,"bad"); sfxBad();
      problem.classList.remove("shake"); void problem.offsetWidth; problem.classList.add("shake");
      advance(2200);
    }
  }
  function start(){
    q=0; right=0; locked=false; stopFx();
    $("play").hidden=false; $("end").hidden=true;
    $("legoBox").classList.remove("done");
    pickModel();
    $("cap").textContent="Đang xây: "+model.n+" Lego. Mỗi câu đúng thêm 1 mảnh!";
    drawLego(0,-1); setMsg("Hãy nhập đáp án nhé!",""); next();
  }
  ans.addEventListener("input",function(){ ans.value=ans.value.replace(/\D/g,""); });
  ans.addEventListener("keydown",function(e){ if(e.key==="Enter") check(); });
  $("check").addEventListener("click",check);
  $("again").addEventListener("click",start);
  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click",function(){
      mode=c.dataset.mode;
      document.querySelectorAll(".chip").forEach(function(o){o.setAttribute("aria-pressed",o===c?"true":"false")});
      start();
    });
  });
  start();
})();
